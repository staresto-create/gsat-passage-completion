<style>
  :root{--paper:#FDFBF5; --paper-card:#FFFDF7; --ink:#221F1A; --ink-soft:#6B6558;
        --rule:#DCD3BB; --crimson:#AE3626; --sage:#3E6E52;}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink);
       font-family:'Noto Sans TC',sans-serif; line-height:1.9;
       display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;}
  .box{max-width:560px; width:100%; background:var(--paper-card);
       border:1px solid var(--rule); border-radius:6px; padding:32px 28px; text-align:center;}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; color:var(--sage);
           font-weight:700; text-transform:uppercase; margin-bottom:10px;}
  h1{font-family:'Noto Serif TC',serif; font-weight:900; font-size:24px;
     margin:0 0 14px; letter-spacing:.02em;}
  p{font-size:14px; color:var(--ink-soft); margin:0 0 10px;}
  p b{color:var(--ink);}
  .btn{display:inline-block; margin:20px 0 6px; background:var(--ink); color:var(--paper-card);
       text-decoration:none; font-weight:700; font-size:15px; padding:14px 30px; border-radius:4px;}
  .btn:hover{background:var(--crimson);}
  .url{font-size:12px; color:var(--ink-soft); word-break:break-all; margin-top:14px;}
  .url a{color:var(--sage);}
  .note{margin-top:22px; padding-top:16px; border-top:1px dashed var(--rule);
        font-size:12.5px; color:var(--ink-soft);}
</style>
</head>
<body>
  <div class="box">
    <div class="eyebrow">已搬家 · Moved</div>

    <p>幾秒後會自動帶你過去，也可以直接點下面的按鈕。</p>

    <a class="btn" href="https://staresto-create.github.io/passage-completion/">前往新網站 →</a>

      新網址：<a href="https://staresto-create.github.io/passage-completion/">https://staresto-create.github.io/passage-completion/</a><br>
